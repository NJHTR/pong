[package]
name = "pong-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
publish = false
description = "Pong durable primitives for AI-agent execution history"
license = "Apache-2.0"

[workspace]
resolver = "2"

[lib]
name = "pong_core"
path = "src/lib.rs"

[features]
direct-access-stress = []

[dependencies]
fs2 = "0.4"
libc = "0.2"
hex = "0.4"
rusqlite = { version = "=0.32.1", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
proptest = { version = "=1.8.0", default-features = false, features = ["std"] }
tempfile = "=3.15.0"

[profile.release]
lto = "thin"
codegen-units = 1
